name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore TemporalDurableObjects.slnx

      - name: Build
        run: dotnet build TemporalDurableObjects.slnx --configuration Release --no-restore --nologo

      - name: Integration tests
        run: dotnet test tests/TemporalCommunity.DurableObjects.IntegrationTests --configuration Release --no-build --nologo --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: integration-test-results
          path: tests/TemporalCommunity.DurableObjects.IntegrationTests/**/*.trx
