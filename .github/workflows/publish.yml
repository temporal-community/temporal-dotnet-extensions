name: Publish to NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Pack and publish to NuGet.org
    runs-on: ubuntu-latest
    environment: nuget-publish   # configure this environment in GitHub repo settings
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publishing token exchange

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore TemporalDurableObjects.slnx

      - name: Build
        run: dotnet build src/TemporalCommunity.DurableObjects --configuration Release --no-restore --nologo

      - name: Pack
        run: dotnet pack src/TemporalCommunity.DurableObjects --configuration Release --no-build --nologo --output artifacts/packages

      # Exchange the GitHub OIDC JWT for a short-lived NuGet API key.
      # NuGet/login hits https://www.nuget.org/api/v2/token with the OIDC token
      # and returns a single-use key valid for ~1 hour.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          token-service-url: https://www.nuget.org/api/v2/token

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
