name: Build & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer needs full history for tag resolution

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore TemporalDurableObjects.slnx

      - name: Build
        run: dotnet build TemporalDurableObjects.slnx --configuration Release --no-restore --nologo

      - name: Unit tests
        run: dotnet test tests/TemporalCommunity.DurableObjects.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=unit.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-results-${{ matrix.os }}
          path: tests/TemporalCommunity.DurableObjects.Tests/**/*.trx
