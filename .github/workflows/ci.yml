name: Build & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer needs full history for tag resolution

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore TemporalDurableObjects.slnx

      - name: Build
        run: dotnet build TemporalDurableObjects.slnx --configuration Release --no-restore --nologo

      - name: Unit tests
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          dotnet test tests/TemporalCommunity.DurableObjects.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=unit.trx"
          dotnet test tests/TemporalCommunity.Extensions.Analyzers.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=analyzers.trx"
          dotnet test tests/TemporalCommunity.DurableObjects.Analyzers.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=durable-analyzers.trx"
          dotnet test tests/TemporalCommunity.DurableObjects.GeneratedClients.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=generated-clients.trx"
          dotnet test tests/TemporalCommunity.Extensions.Analyzers.CodeFixes.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=analyzer-codefixes.trx"
          dotnet test tests/TemporalCommunity.DurableObjects.Analyzers.CodeFixes.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=durable-analyzer-codefixes.trx"
          dotnet test tests/TemporalCommunity.Templates.Tests --configuration Release --no-build --nologo --logger "trx;LogFileName=templates.trx"

      - name: Install just
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@just

      - name: Remove no-longer-needed build outputs
        if: matrix.os == 'ubuntu-latest'
        run: find samples tests benchmarks -type d -name bin -prune -exec rm -rf {} +

      - name: Verify package assets and consumers
        if: matrix.os == 'ubuntu-latest'
        run: just pack-verify --no-build

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-results-${{ matrix.os }}
          path: tests/**/*.trx

  template-smoke-test:
    name: template runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer needs full history for tag resolution

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@v0

      - name: Install Aspire CLI
        # --version is a named flag, not positional (confirmed by downloading and reading the
        # real install script) — a bare positional version argument would be silently ignored.
        run: curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.6.0

      - name: Add Aspire CLI to PATH
        run: echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Runtime smoke test (standalone + Aspire)
        run: just template-smoke-test
